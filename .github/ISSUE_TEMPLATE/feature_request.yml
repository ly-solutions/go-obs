name: Feature request
description: Suggest an improvement or a new router integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind. Note any change to metric names or labels.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now (a custom RouteFunc, ObserveRequest, ...).
